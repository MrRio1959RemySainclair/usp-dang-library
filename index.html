async function getCat(){const{data}=await sb.rpc('catalog');CAT=data||[]}
function list(){const q=Q.toLowerCase(),r=CAT.filter(b=>(!q||(b.title+' '+(b.author||'')).toLowerCase().includes(q))&&(F=='all'||(F=='avail'&&isAv(b))||(F=='out'&&b.due_at)||(F=='mine'&&(b.my_pos||b.mine_hold))));$('#list').innerHTML=r.map(card).join('')||`<div class="card sub">${t('none')}</div>`}
function donut(ps){const C=2*Math.PI*40,n=ps.reduce((a,p)=>a+p.v,0),tot=n||1;let o=0;return`<svg viewBox="0 0 100 100" class="dn"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--ort)" stroke-width="14"/>${ps.filter(p=>p.v).map(p=>{const l=p.v/tot*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${p.c}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=l;return s}).join('')}<text x="50" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="var(--tx)">${n}</text></svg>`}
const bars=(v,lb)=>{const m=Math.max(...v,1);return`<div class="bars">${v.map((x,i)=>`<div class="bc"><span>${x}</span><i style="height:${x/m*100}px"></i><em style="font-style:normal">${lb[i]}</em></div>`).join('')}</div>`};
async function stats(){const[d,l,q,p]=await Promise.all([sb.rpc('catalog'),sb.from('loans').select('*,books(title),profiles(full_name)'),sb.from('reservations').select('id'),sb.from('profiles').select('id').eq('role','user')]);
 const B=d.data||[],Lo=l.data||[],now=new Date(),out=Lo.filter(x=>!x.returned_at),ms=[...Array(6)].map((_,i)=>{const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-5+i);return x});
 return{B,Lo,out,late:out.filter(x=>new Date(x.due_at)<now),nm:(p.data||[]).length,nq:(q.data||[]).length,av:B.filter(isAv).length,rs:B.filter(b=>!b.due_at&&b.held).length,ol:B.filter(b=>b.due_at).length,ms,cn:ms.map(m=>Lo.filter(x=>{const a=new Date(x.borrowed_at);return a.getMonth()==m.getMonth()&&a.getFullYear()==m.getFullYear()}).length)}}
function dash(S,full){const st=(n,l)=>`<div><b>${n}</b>${t(l)}</div>`,top=f=>{const m={};S.Lo.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,c)=>c[1]-a[1]).slice(0,5).map(e=>esc(e[0])+' — '+e[1]).join('<br>')||`<span class="sub">${t('noData')}</span>`};
 return`<div class="stats">${st(S.B.length,'sBooks')}${st(S.av,'sAvail')}${st(S.nm,'sMem')}${st(S.out.length,'sOut')}${st(S.late.length,'sLate')}${st(S.nq,'sQ')}</div>
<div class="g2"><div class="card"><b>${t('distrib')}</b><div class="row" style="justify-content:flex-start;gap:18px;margin-top:8px">${donut([{v:S.av,c:'var(--ok)'},{v:S.ol,c:'var(--or)'},{v:S.rs,c:'var(--wa)'}])}<div class="lg2"><span><i style="background:var(--ok)"></i>${t('avail')} (${S.av})</span><span><i style="background:var(--or)"></i>${t('f_out')} (${S.ol})</span><span><i style="background:var(--wa)"></i>${t('reserved')} (${S.rs})</span></div></div></div>
<div class="card"><b>${t('perMonth')}</b>${bars(S.cn,S.ms.map(m=>m.toLocaleDateString(loc(),{month:'short'})))}</div></div>
${full?`<div class="g2"><div class="card"><b>${t('topBooks')}</b><p>${top(x=>x.books?.title)}</p></div><div class="card"><b>${t('topMem')}</b><p>${top(x=>x.profiles?.full_name)}</p></div></div>`:''}
<h2>${t('lateNow')}</h2><div class="card">${S.late.map(x=>esc(x.books?.title)+' — '+esc(x.profiles?.full_name)+' ('+fd(x.due_at)+')').join('<br>')||`<span class="sub">${t('noneF')}</span>`}</div>${full?`<p class="sub">${t('gen',{d:fd(new Date())})}</p>`:''}`}
const empty=(k,c)=>`<tr><td colspan="${c}" class="sub">${t(k)}</td></tr>`;
const views={
async catalog(){await getCat();return`<div class="card sr">${ic('search')}<input id="q" value="${esc(Q)}" placeholder="${t('search')}" oninput="Q=this.value;list()"></div><div class="chips">${['all','avail','out','mine'].map(f=>`<button class="${F==f?'on':''}" onclick="F='${f}';draw()">${t('f_'+f)}</button>`).join('')}</div><div id="list"></div>`},
async book(id){await getCat();const b=CAT.find(x=>x.id==id);if(!b)return`<div class="card sub">${t('nf')}</div>`;
 return`<button class="g" onclick="history.length>1?history.back():nav('')">${ic('back')} ${t('back')}</button><div class="card"><div class="row" style="justify-content:flex-start;align-items:flex-start;gap:16px">${cover(b,'lg')}<div class="fx"><h1>${esc(b.title)}</h1><div class="sub">${esc(b.author||'')}</div><p>${badge(b)}</p>${b.queue_count?`<div class="sub">${t('waiting',{n:b.queue_count})}</div>`:''}${b.description?`<p>${esc(b.description)}</p>`:''}<div style="margin-top:12px">${act1(b)}</div></div></div></div>`},
async mine(){const{data:l}=await sb.from('loans').select('*,books(title)').eq('user_id',me.id).is('returned_at',null).maybeSingle();
 const{data:rs}=await sb.from('reservations').select('*,books(title)').eq('user_id',me.id);let h;
 if(l){const a=new Date(l.borrowed_at),d=new Date(l.due_at),p=Math.min(100,Math.max(0,(Date.now()-a)/(d-a)*100)),n=Math.ceil((d-Date.now())/D),c=n<0?'e':n<=3?'w':'';
  h=`<div class="card"><div class="row"><b>${esc(l.books.title)}</b><span class="tag ${c}">${n<0?t('late',{n:-n}):t('left',{n})}</span></div><div class="sub">${t('span',{a:fd(a),b:fd(d)})}</div><div class="bar"><i class="${c}" style="width:${p}%"></i></div><div class="sub">${t('elapsed',{n:Math.round(p)})}</div></div>`}
 else h=`<div class="card sub">${t('noLoan')}</div>`;
 return h+`<h2>${t('myReq')}</h2>`+((rs||[]).map(r=>`<div class="card row"><div><b>${esc(r.books.title)}</b><div class="sub">${r.hold_until?t('readyUntil',{d:fd(r.hold_until)}):t('inQ')}</div></div><button class="g" onclick="leave('${r.id}')">${t('cancel')}</button></div>`).join('')||`<div class="sub">${t('noReq')}</div>`)},
async alerts(){const{data}=await sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(40);
 return`<div class="row"><button onclick="perm()">${ic('bell')} ${t('notif')}</button><button class="g" onclick="readAll()">${t('readAll')}</button></div>`+((data||[]).map(n=>`<div class="card" style="${n.read?'opacity:.6':''}">${esc(n.message)}<div class="sub">${fd(n.created_at)}</div></div>`).join('')||`<div class="card sub">${t('noAl')}</div>`)},
async profile(){return`<div class="card"><div class="row" style="justify-content:flex-start"><div class="av">${esc((me.full_name||'?')[0].toUpperCase())}</div><div><b>${esc(me.full_name)}</b><div class="sub">${esc(me.email||'')}${me.role=='admin'?' · '+t('admin'):''}</div></div></div></div>
<div class="card"><div class="row"><span>${ic('globe')} ${t('lang')}</span><div class="seg2">${['fr','en'].map(l=>`<button class="${L==l?'on':''}" onclick="setL('${l}')">${l.toUpperCase()}</button>`).join('')}</div></div><div class="row" style="margin-top:12px"><span>${ic('sun')} ${t('theme')}</span><div class="seg2"><button class="${th=='light'?'on':''}" onclick="setTh('light')">${t('light')}</button><button class="${th=='dark'?'on':''}" onclick="setTh('dark')">${t('dark')}</button></div></div></div>
${canInst()?`<button class="p" onclick="inst()">${ic('download')} ${t('install')}</button> `:''}<button class="g" onclick="out()">${ic('logout')} ${t('logout')}</button>`},
async overview(){return dash(await stats(),0)},
async reports(){return`<div class="row noprint"><h2 style="margin:0">${t('reports')}</h2><button class="p" onclick="print()">${ic('download')} ${t('pdf')}</button></div>`+dash(await stats(),1)},
async books(){await getCat();return`<div class="card"><b>${t('addBook')}</b><input id="bt" placeholder="${t('title')}"><input id="ba" placeholder="${t('author')}"><input id="bc" placeholder="${t('cover')}"><textarea id="bd" rows="2" placeholder="${t('desc')}"></textarea><button class="p" onclick="addBook()">${ic('book')} ${t('add')}</button></div>`+CAT.map(b=>`<div class="card bk" style="cursor:default">${cover(b)}<div class="fx"><b>${esc(b.title)}</b><div class="sub">${esc(b.author||'')}</div><div class="row" style="margin-top:8px">${badge(b)}<button class="g" ${b.due_at?'disabled':''} onclick="delBook('${b.id}')">${ic('trash')}</button></div></div></div>`).join('')},
async loans(){const{data}=await sb.from('loans').select('*,books(title),profiles(full_name)').order('borrowed_at',{ascending:false});
 return`<div class="card tw"><table><tr><th>${t('books')}</th><th>${t('member')}</th><th>${t('taken')}</th><th>${t('due')}</th><th>${t('state')}</th><th></th></tr>`+((data||[]).map(l=>`<tr><td>${esc(l.books?.title)}</td><td>${esc(l.profiles?.full_name)}</td><td>${fd(l.borrowed_at)}</td><td>${fd(l.due_at)}</td><td>${l.returned_at?t('retOn',{d:fd(l.returned_at)}):new Date(l.due_at)<new Date()?`<span class="tag e">${t('overdue')}</span>`:`<span class="tag w">${t('onGoing')}</span>`}</td><td>${l.returned_at?'':`<button onclick="giveBack('${l.id}')">${t('ret')}</button>`}</td></tr>`).join('')||empty('noLoans',6))+'</table></div>'},
async queue(){const{data}=await sb.from('reservations').select('*,books(title),profiles(full_name)').order('created_at');
 return`<div class="card tw"><table><tr><th>${t('books')}</th><th>${t('member')}</th><th>${t('since')}</th><th>${t('state')}</th></tr>`+((data||[]).map(q=>`<tr><td>${esc(q.books?.title)}</td><td>${esc(q.profiles?.full_name)}</td><td>${fd(q.created_at)}</td><td>${q.hold_until?t('resUntil',{d:fd(q.hold_until)}):t('inQ')}</td></tr>`).join('')||empty('emptyQ',4))+'</table></div>'},
async members(){const[p,l]=await Promise.all([sb.from('profiles').select('*').order('full_name'),sb.from('loans').select('user_id,returned_at,due_at,books(title)')]);const Lo=l.data||[];
 return`<div class="card tw"><table><tr><th>${t('member')}</th><th>${t('email')}</th><th>${t('total')}</th><th>${t('current')}</th><th>${t('state')}</th></tr>`+((p.data||[]).map(m=>{const mine=Lo.filter(x=>x.user_id==m.id),c=mine.find(x=>!x.returned_at);return`<tr><td>${esc(m.full_name)}${m.role=='admin'?' <span class="tag">admin</span>':''}</td><td>${esc(m.email||'')}</td><td>${mine.length}</td><td>${c?esc(c.books?.title):'—'}</td><td>${c&&new Date(c.due_at)<new Date()?`<span class="tag e">${t('overdue')}</span>`:`<span class="tag ok">${t('ok')}</span>`}</td></tr>`}).join('')||empty('noData',5))+'</table></div>'}};
const route=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
const pick=p=>p[0]=='admin'?[({livres:'books',emprunts:'loans',file:'queue',membres:'members',rapports:'reports'})[p[1]]||'overview']:p[0]=='livre'?['book',p[1]]:[({emprunt:'mine',alertes:'alerts',profil:'profile'})[p[0]]||'catalog'];
const tools=()=>`<div class="tl">${canInst()?`<button class="g ib" title="${t('install')}" onclick="inst()">${ic('download')}</button>`:''}<button class="g ib" onclick="setL('${L=='fr'?'en':'fr'}')">${L=='fr'?'EN':'FR'}</button><button class="g ib" onclick="setTh('${th=='dark'?'light':'dark'}')">${ic(th=='dark'?'sun':'moon')}</button>${me?.role=='admin'?`<button class="g ib" onclick="nav('profil')">${ic('user')}</button>`:''}</div>`;
async function draw(){const a=$('#app'),m=msg,g=good;msg='';if(!ready){a.innerHTML='';return}const p=route();
 if(!me){const reg=p[0]=='inscription';a.innerHTML=`<div class="appbar"><span></span>${tools()}</div><div class="auth"><img src="assets/icons/logo.png" alt="USP-Dang Library"><p class="sub">${t('tagline')}</p><div class="card"><div class="seg"><button class="${reg?'':'on'}" onclick="nav('connexion')">${t('login')}</button><button class="${reg?'on':''}" onclick="nav('inscription')">${t('signup')}</button></div>${reg?`<input id="nm" placeholder="${t('name')}" autocomplete="name">`:''}<input id="em" type="email" placeholder="${t('email')}" autocomplete="email"><input id="pw" type="password" placeholder="${t('pwd')}" autocomplete="current-password"><div class="msg ${g?'ok':''}">${esc(m)}</div><button class="p" style="width:100%" onclick="auth()">${reg?t('signupBtn'):t('loginBtn')}</button></div></div>`;return}
 const adm=me.role=='admin';
 if(['connexion','inscription'].includes(p[0])||(adm&&p[0]!='admin'&&p[0]!='profil')||(!adm&&p[0]=='admin')){location.replace('#/'+(adm?'admin':''));return}
 const [v,arg]=pick(p),cur=p.join('/');let un=0;
 if(!adm){const r=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',me.id).eq('read',false);un=r.count||0}
 const items=adm?[['admin','overview','grid'],['admin/livres','books','book'],['admin/emprunts','loans','list'],['admin/file','queue','clock'],['admin/membres','members','users'],['admin/rapports','reports','chart']]:[['','catalog','book'],['emprunt','loan','clock'],['alertes','alerts','bell'],['profil','profile','user']];
 const body=await views[v](arg);
 a.innerHTML=`${updW?`<div class="upd"><span>${ic('refresh')} ${t('updAvail')}</span><button onclick="applyUpd()">${t('updBtn')}</button></div>`:''}<div class="appbar"><div class="logo"><img src="assets/icons/logo.png" alt=""><div><h1>USP-Dang Library</h1><div class="sub">${esc(me.full_name)}${adm?' · '+t('admin'):''}</div></div></div>${tools()}</div><div class="msg ${g?'ok':''}">${esc(m)}</div>${body}<nav class="bn">${items.map(i=>`<button class="${i[0]==cur||(i[0]==''&&p[0]=='livre')?'on':''}" onclick="nav('${i[0]}')">${ic(i[2])}<span>${t(i[1])}</span>${i[1]=='alerts'&&un?`<b class="dot">${un}</b>`:''}</button>`).join('')}</nav>`;
 if(v=='catalog')list()}
addEventListener('hashchange',draw);draw();
</script></body></html>
